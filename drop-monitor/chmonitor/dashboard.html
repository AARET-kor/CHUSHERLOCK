<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M13 5h6v8h8v6h-8v8h-6v-8H5v-6h8z' fill='%23e8e4dc'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0b0c; --panel:#141416; --panel-2:#1b1b1e; --line:#2a2a2e;
  --text:#ecebe7; --muted:#8d8c88; --faint:#5d5c59;
  --silver:#c9c7c1; --ok:#5fd18a; --warn:#e7b44c; --alert:#ff5a4f;
  --radius:12px;
  --serif: "Didot","Bodoni 72","Playfair Display","Times New Roman",serif;
  --sans: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}

/* header */
header{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1440px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--serif);font-weight:700;letter-spacing:.22em;font-size:17px}
.brand span{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 0 rgba(95,209,138,.6);animation:pulse 2s infinite}
.dot.checking{background:var(--warn)}
.dot.error{background:var(--alert)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(95,209,138,0)}100%{box-shadow:0 0 0 0 rgba(95,209,138,0)}}
.status strong{color:var(--text);font-weight:600}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:7px 13px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--silver)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--text);color:#000;border-color:var(--text);font-weight:600}

main{max-width:1440px;margin:0 auto;padding:20px}
.err{display:none;margin-bottom:16px;padding:12px 14px;border:1px solid rgba(255,90,79,.4);background:rgba(255,90,79,.08);border-radius:var(--radius);color:#ffb3ad}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.stat .k{color:var(--muted);font-size:12px;letter-spacing:.04em}
.stat .v{font-size:26px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{color:var(--faint);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chan i{font-style:normal;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.chan i.on{color:var(--text);border-color:#4a4a50;background:var(--panel-2)}

.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--silver)}
.ph small{color:var(--faint)}

/* feed */
.feed{position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.feed ol{list-style:none;margin:0;padding:6px;overflow:auto}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px;border-radius:9px}
.ev:hover{background:var(--panel-2)}
.ev .thumb{width:44px;height:44px;border-radius:7px;background:#fff center/contain no-repeat;border:1px solid var(--line)}
.ev .thumb.none{background:var(--panel-2);display:grid;place-items:center;color:var(--muted);font-size:18px}
.ev .t{font-weight:600;overflow-wrap:anywhere}
.ev .d{color:var(--muted);font-size:12.5px}
.ev .m{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--faint)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--panel-2);color:var(--silver);border:1px solid var(--line)}
.tag.new_product,.tag.relisted,.tag.category_open{background:var(--alert);border-color:var(--alert);color:#fff}
.tag.restock{background:var(--ok);border-color:var(--ok);color:#06210f}
.tag.price_change{color:var(--warn);border-color:rgba(231,180,76,.5)}
.tag.error{color:var(--alert);border-color:rgba(255,90,79,.5)}
.buy{margin-left:auto;font-weight:600;color:var(--text);text-decoration:none;border-bottom:1px solid var(--faint)}
.buy:hover{border-color:var(--text)}
.empty{padding:28px 16px;color:var(--faint);text-align:center}

/* categories */
.cats{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cat{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px dashed var(--line);color:var(--faint);font-size:12.5px;text-decoration:none}
.cat.open{border-style:solid;border-color:#4a4a50;color:var(--text);background:var(--panel-2)}
.cat.open b{font-weight:600;color:var(--silver);font-variant-numeric:tabular-nums}
.cat .lock{opacity:.7}

/* products */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--text);font:inherit;font-size:13px;width:220px;max-width:100%}
.search:focus{outline:none;border-color:var(--silver)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--text);color:#000;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:16px}
.card{display:flex;flex-direction:column;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.card.gone{opacity:.45}
.img{position:relative;aspect-ratio:1;background:#fff center/contain no-repeat}
.img .badge{position:absolute;top:8px;left:8px}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:600;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:8px}
.price{color:var(--text);font-variant-numeric:tabular-nums}
.sizes{display:flex;flex-wrap:wrap;gap:4px}
.sz{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid #3a3a3f;color:var(--silver)}
.sz.out{color:var(--faint);border-color:var(--line);text-decoration:line-through}
.sz.pref{border-color:var(--text);color:var(--text);font-weight:700}
.card .go{margin-top:auto;text-align:center;padding:7px;border-radius:7px;background:var(--text);color:#000;font-weight:650;font-size:12.5px;text-decoration:none}
.card .go:hover{background:#fff}
.card.gone .go{background:var(--panel);color:var(--muted)}

.foot{color:var(--faint);font-size:12px;margin:18px 2px 0;display:flex;gap:16px;flex-wrap:wrap}

@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .feed{position:static;max-height:none}
  .feed ol{max-height:420px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .bar{padding:12px 16px;gap:10px}
  main{padding:16px}
  .brand span{display:none}
  .brand b{font-size:14px;letter-spacing:.14em}
  .btn{padding:6px 11px;font-size:12.5px}
  .status{order:3;width:100%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
  .search{width:100%}
  .stat .v{font-size:22px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M13 3h6v10h10v6H19v10h-6V19H3v-6h10z" fill="currentColor"/></svg>
      <b>CHROME HEARTS</b><span>Drop Monitor</span>
    </div>
    <div class="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusText">연결 중…</span></div>
    <div class="actions">
      <button class="btn" id="testBtn" type="button">테스트 알림</button>
      <button class="btn primary" id="checkBtn" type="button">지금 확인</button>
    </div>
  </div>
</header>

<main>
  <div class="err" id="err"></div>

  <section class="stats" aria-label="요약">
    <div class="stat"><div class="k">판매 중 상품</div><div class="v" id="sProducts">–</div><div class="s" id="sProductsSub">&nbsp;</div></div>
    <div class="stat"><div class="k">열린 카테고리</div><div class="v" id="sCats">–</div><div class="s" id="sCatsSub">&nbsp;</div></div>
    <div class="stat"><div class="k">최근 24시간 알림</div><div class="v" id="sEvents">–</div><div class="s" id="sEventsSub">&nbsp;</div></div>
    <div class="stat"><div class="k">알림 채널</div><div class="chan" id="sChan"></div><div class="s" id="sWatch">&nbsp;</div></div>
  </section>

  <div class="layout">
    <section class="panel feed" aria-label="알림 기록">
      <div class="ph"><h2>알림 기록</h2><small id="feedCount"></small></div>
      <ol id="feed"></ol>
    </section>

    <section class="panel" aria-label="상품">
      <div class="ph">
        <h2>스토어</h2>
        <div class="tools">
          <input class="search" id="q" type="search" placeholder="상품 검색" aria-label="상품 검색">
          <div class="seg" role="group" aria-label="보기">
            <button type="button" data-view="listed" aria-pressed="true">판매 중</button>
            <button type="button" data-view="new" aria-pressed="false">새로 본 것</button>
            <button type="button" data-view="all" aria-pressed="false">전체</button>
          </div>
        </div>
      </div>
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>

  <div class="foot" id="foot"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const BASE = "https://www.chromehearts.com/";
const KIND = {new_product:"신상품", relisted:"재등록", restock:"재입고", category_open:"카테고리", price_change:"가격", error:"오류", test:"테스트"};
let S = null, view = "listed", lastEventCount = null;
try { view = localStorage.getItem("chm.view") || view; } catch (e) {}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
  return n;
}
const ts = s => s ? new Date(s.replace(" ", "T")).getTime() : 0;
function ago(s) {
  if (!s) return "–";
  const d = Math.round((Date.now() - ts(s)) / 1000);
  if (d < 5) return "방금";
  if (d < 60) return d + "초 전";
  if (d < 3600) return Math.floor(d / 60) + "분 전";
  if (d < 86400) return Math.floor(d / 3600) + "시간 전";
  return Math.floor(d / 86400) + "일 전";
}
function until(s) {
  const d = Math.round((ts(s) - Date.now()) / 1000);
  return d <= 0 ? "곧" : d < 60 ? d + "초 후" : Math.floor(d / 60) + "분 " + (d % 60) + "초 후";
}
const money = p => p ? "$" + Number(String(p).replace(/,/g, "")).toLocaleString("en-US") : "";
// products first seen after the baseline (the first check ever) are drops
function isFresh(p) {
  if (!S || !p.first_seen) return false;
  const base = Math.min(...S.products.map(x => ts(x.first_seen)).filter(Boolean));
  const t = ts(p.first_seen);
  return t - base > 10e3 && Date.now() - t < 864e5;
}
const imgStyle = u => u ? `background-image:url("${encodeURI(u).replace(/"/g, "%22")}")` : "";

function renderStatus() {
  if (!S) return;
  const st = S.status, dot = $("dot");
  dot.className = "dot " + (st.checking ? "checking" : st.state === "error" ? "error" : st.state === "ok" ? "ok" : "");
  let t;
  if (st.checking) t = [el("strong", {}, "확인 중…")];
  else if (st.state === "error") t = [el("strong", {}, "접속 오류"), ` · ${st.fails}회 연속 · 다음 시도 ${until(st.next_check)}`];
  else if (st.last_ok) t = [el("strong", {}, "감시 중"), ` · ${ago(st.last_ok)} 확인 · 다음 ${until(st.next_check)}`];
  else t = [el("strong", {}, "첫 확인 중…")];
  $("statusText").replaceChildren(...t);
  $("checkBtn").disabled = !!st.checking;
  const e = $("err");
  if (st.state === "error" && st.last_error) { e.style.display = "block"; e.textContent = "chromehearts.com 접속 실패: " + st.last_error; }
  else e.style.display = "none";
}

function render() {
  const products = S.products, listed = products.filter(p => p.listed);
  const cats = Object.entries(S.categories);
  const open = cats.filter(([, n]) => n > 0);
  const day = Date.now() - 864e5;
  const recent = S.events.filter(e => ts(e.time) > day && e.kind !== "test");
  const fresh = listed.filter(isFresh);

  $("sProducts").textContent = listed.length;
  $("sProductsSub").textContent = fresh.length ? `오늘 새로 본 상품 ${fresh.length}개` : `기록된 전체 ${products.length}개`;
  $("sCats").textContent = cats.length ? `${open.length} / ${cats.length}` : "–";
  $("sCatsSub").textContent = cats.length ? `닫힘: ${cats.filter(([, n]) => !n).map(([c]) => c).slice(0, 4).join(", ")}${cats.length - open.length > 4 ? " …" : ""}` : " ";
  $("sEvents").textContent = recent.length;
  $("sEventsSub").textContent = S.events.length ? "마지막 " + ago(S.events[S.events.length - 1].time) : "아직 없음";
  const ch = S.config.channels, names = {telegram:"텔레그램", ntfy:"ntfy", discord:"디스코드", desktop:"데스크톱", sound:"소리"};
  $("sChan").replaceChildren(...Object.entries(names).map(([k, v]) => el("i", {class: ch[k] ? "on" : ""}, (ch[k] ? "● " : "") + v)));
  const kw = S.config.keywords, sz = S.config.preferred_sizes;
  $("sWatch").textContent = (kw.length ? "키워드 " + kw.join(", ") : "모든 상품") + (sz.length ? " · 사이즈 " + sz.join(">") : "");

  // feed
  const evs = S.events.slice().reverse();
  $("feedCount").textContent = evs.length ? evs.length + "건" : "";
  $("feed").replaceChildren(...(evs.length ? evs.map(e => el("li", {class: "ev"},
    e.image ? el("div", {class: "thumb", style: imgStyle(e.image)}) : el("div", {class: "thumb none"}, e.kind === "category_open" ? "▣" : e.kind === "error" ? "!" : "✚"),
    el("div", {},
      el("div", {class: "t"}, e.title.replace(/^[^:]+:\s*/, "")),
      e.detail ? el("div", {class: "d"}, e.detail) : null,
      el("div", {class: "m"}, el("span", {class: "tag " + e.kind}, KIND[e.kind] || e.kind), el("span", {title: e.time}, ago(e.time)),
        e.link ? el("a", {class: "buy", href: e.link, target: "_blank", rel: "noopener"}, e.kind === "category_open" ? "열기 →" : "구매 →") : null)
    ))) : [el("li", {class: "empty"}, S.status.cycles > 0 ? "아직 변화가 없습니다. 드롭이 뜨면 여기에 쌓입니다." : "첫 확인이 끝나면 현재 상태를 기준으로 감시를 시작합니다.")]));

  // categories
  $("cats").replaceChildren(...cats.sort((a, b) => (b[1] > 0) - (a[1] > 0) || a[0].localeCompare(b[0])).map(([c, n]) =>
    n > 0 ? el("a", {class: "cat open", href: BASE + encodeURIComponent(c), target: "_blank", rel: "noopener"}, c, el("b", {}, n >= 12 ? "12+" : n))
          : el("span", {class: "cat", title: "닫힘: 드롭 때 열리면 알림"}, el("span", {class: "lock"}, "🔒"), c)));

  renderGrid();
  renderStatus();
  $("foot").replaceChildren(
    el("span", {}, `확인 간격 ${Math.round(S.config.interval_seconds)}초`),
    el("span", {}, `완료한 확인 ${S.status.cycles}회`),
    el("span", {}, `시작 ${ago(S.status.started)}`),
    el("span", {}, S.config.auto_open_browser ? "알림 시 구매 페이지 자동 열기 켜짐" : "자동 열기 꺼짐"));
}

function renderGrid() {
  const q = $("q").value.trim().toLowerCase();
  const pref = S.config.preferred_sizes.map(s => s.toUpperCase());
  let list = S.products.filter(p => view === "all" || (view === "listed" ? p.listed : isFresh(p)));
  if (q) list = list.filter(p => (p.name + " " + p.category + " " + p.pid).toLowerCase().includes(q));
  list.sort((a, b) => (b.listed - a.listed) || (ts(b.first_seen) - ts(a.first_seen)) || a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view));
  if (!list.length) {
    $("grid").replaceChildren(el("div", {class: "empty", style: "grid-column:1/-1"}, S.products.length ? "조건에 맞는 상품이 없습니다." : "상품을 불러오는 중…"));
    return;
  }
  $("grid").replaceChildren(...list.map(p => {
    const isNew = isFresh(p);
    const sizes = Object.entries(p.sizes || {});
    return el("article", {class: "card" + (p.listed ? "" : " gone")},
      el("div", {class: "img", style: imgStyle(p.image)}, isNew ? el("span", {class: "tag new_product badge"}, "NEW") : !p.listed ? el("span", {class: "tag badge"}, "내려감") : null),
      el("div", {class: "body"},
        el("div", {class: "name"}, p.name),
        el("div", {class: "meta"}, el("span", {}, p.category), el("span", {class: "price"}, money(p.price))),
        sizes.length ? el("div", {class: "sizes"}, sizes.map(([id, ok]) => {
          const lab = (p.size_labels || {})[id] || id;
          const isPref = ok && (pref.includes(lab.toUpperCase()) || pref.includes(id.toUpperCase()));
          return el("span", {class: "sz" + (ok ? "" : " out") + (isPref ? " pref" : ""), title: ok ? "재고 있음" : "품절"}, lab);
        })) : null,
        el("a", {class: "go", href: p.buy_url, target: "_blank", rel: "noopener"}, p.listed ? "구매 페이지 →" : "상품 페이지 →")));
  }));
}

async function load() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    S = await r.json();
    if (lastEventCount !== null && S.events.length > lastEventCount) {
      document.title = "🚨 새 드롭 · Drop Monitor";
      setTimeout(() => document.title = "Drop Monitor", 15000);
    }
    lastEventCount = S.events.length;
    render();
  } catch (e) {
    $("dot").className = "dot error";
    $("statusText").textContent = "모니터 프로세스에 연결할 수 없습니다 (종료되었나요?)";
  }
}
async function act(path, btn, label) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = label;
  try { await fetch(path, {method: "POST", headers: {"X-CH-Dashboard": "1"}}); } finally {
    setTimeout(() => { btn.textContent = old; btn.disabled = false; load(); }, 1200);
  }
}
$("checkBtn").onclick = e => act("/api/check", e.currentTarget, "요청함");
$("testBtn").onclick = e => act("/api/test-notify", e.currentTarget, "보냄");
$("q").oninput = () => S && renderGrid();
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  view = b.dataset.view; try { localStorage.setItem("chm.view", view); } catch (e) {}
  S && renderGrid();
});
